name: Verify and release public app
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: {go-version: "1.27.3", cache: false}
      - run: go test -race ./...
        working-directory: remote_home_assistant/src
      - run: python3 scripts/check_release.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: remote_home_assistant
          platforms: linux/amd64,linux/arm64
          push: false
      - uses: actions/upload-artifact@v4
        with: {name: installable-app, path: ".cache/*.zip"}
  publish-agent:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: image
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ steps.image.outputs.repository }}/agent:${{ github.ref_name }}
