name: Remote Home Assistant
version: "1.0.1"
slug: remote_home_assistant
description: >-
  A secure way back to your Home Assistant. Connect through an encrypted tunnel, choose who gets through, and keep control of your home.
url: https://remote-ha.com
arch: [aarch64, amd64]
startup: services
boot: auto
init: false
homeassistant_api: false
hassio_api: true
hassio_role: default
options:
  pairing_token: ""
schema:
  pairing_token: password
